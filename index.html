<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>モールス・ツリー基板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pcb-dark:#0b1410;
    --pcb:#0f1c15;
    --pcb-light:#16281d;
    --gold:#c9a24a;
    --gold-dim:#5b4a26;
    --gold-line: rgba(201,162,74,0.35);
    --ivory:#e9e2c8;
    --ivory-dim:#8ea18f;
    --red:#ff4b3e;
    --red-glow:#ff8a7d;
    --green:#42e37e;
    --green-glow:#a4ffc9;
    --shadow-deep: rgba(0,0,0,0.7);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(66,227,126,0.06), transparent 55%),
      var(--pcb-dark);
    color:var(--ivory);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 14px 60px;
  }

  .board{
    width:100%;
    max-width:480px;
    background:linear-gradient(180deg, var(--pcb-light), var(--pcb));
    border-radius:22px;
    padding:22px 20px 26px;
    position:relative;
    box-shadow:
      0 30px 70px var(--shadow-deep),
      inset 0 1px 0 rgba(255,255,255,0.03),
      inset 0 0 0 1px rgba(0,0,0,0.6);
  }
  .board::before{
    content:"";
    position:absolute; inset:9px;
    border:1px solid var(--gold-line);
    border-radius:16px;
    pointer-events:none;
  }
  .hole{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #0a0a08, #000 70%);
    box-shadow:0 0 0 2px rgba(201,162,74,0.3), inset 0 1px 2px rgba(0,0,0,0.8);
  }
  .hole.tr{top:14px; right:14px;}

  header{text-align:center; margin-bottom:6px;}
  h1{
    font-family:'Share Tech Mono', monospace;
    font-size:1.15rem;
    letter-spacing:0.12em;
    color:var(--gold);
    margin:0 0 4px;
  }
  header p{
    margin:0; font-size:0.78rem; color:var(--ivory-dim); line-height:1.6;
  }

  .treeWrap{
    margin:10px auto 4px;
    max-width:460px;
  }
  svg{ width:100%; height:auto; display:block; }

  .node-shape{
    fill: var(--pcb);
    stroke: var(--gold-dim);
    stroke-width:2;
    transition: fill 0.12s, stroke 0.12s, filter 0.12s;
  }
  .node-shape.active{
    stroke: var(--red);
    fill:#3a1c16;
    filter: drop-shadow(0 0 6px var(--red));
  }
  .node-shape.visited{
    stroke: var(--gold);
    fill:#3a2f16;
  }
  .node-shape.success{
    stroke: var(--green);
    fill:#123a22;
    filter: drop-shadow(0 0 9px var(--green));
  }
  .node-shape.fail{
    stroke: var(--red);
    fill:#3a1414;
    filter: drop-shadow(0 0 9px var(--red));
  }
  .node-label{
    font-family:'Share Tech Mono', monospace;
    font-size:12px;
    fill: var(--ivory-dim);
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
    transition:fill 0.12s;
  }
  .node-label.lit{ fill:var(--ivory); }

  .edge{
    stroke: var(--gold-line);
    stroke-width:1.6;
    fill:none;
    transition: stroke 0.12s, stroke-width 0.12s, filter 0.12s;
  }
  .edge.active{ stroke:var(--red); stroke-width:2.4; filter:drop-shadow(0 0 4px var(--red)); }
  .edge.success{ stroke:var(--green); stroke-width:2.4; filter:drop-shadow(0 0 4px var(--green)); }

  .rootDot{ fill:var(--gold); }

  .lamp-row{
    display:flex; justify-content:center; align-items:center; gap:10px; margin:8px 0 2px;
  }
  .lamp{
    width:12px; height:12px; border-radius:50%;
    background:#301010;
    box-shadow: inset 0 0 3px rgba(0,0,0,0.8);
    transition:background 0.05s, box-shadow 0.1s;
  }
  .lamp.on-red{ background:var(--red-glow); box-shadow:0 0 10px 3px var(--red); }
  .lamp.on-green{ background:var(--green-glow); box-shadow:0 0 10px 3px var(--green); }

  .buffer{
    text-align:center;
    font-family:'Share Tech Mono', monospace;
    font-size:1.05rem;
    letter-spacing:0.35em;
    color:var(--gold);
    min-height:24px;
    margin:4px 0 14px;
  }
  .buffer .placeholder{ color:var(--ivory-dim); font-size:0.75rem; letter-spacing:normal; font-family:'Zen Kaku Gothic New',sans-serif; }

  .key-wrap{ display:flex; justify-content:center; margin:8px 0 20px; }
  .key{
    width:120px; height:120px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #1d3325, #0f1c15 70%);
    border:5px solid var(--gold-dim);
    box-shadow:
      0 8px 0 #050a07,
      0 12px 18px rgba(0,0,0,0.6),
      inset 0 3px 6px rgba(255,255,255,0.05);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    transition:transform 0.05s, box-shadow 0.05s;
  }
  .key .label{
    font-family:'Share Tech Mono', monospace;
    color:var(--gold);
    font-size:0.72rem;
    letter-spacing:0.05em;
    text-align:center;
    pointer-events:none;
  }
  .key.pressed{
    transform:translateY(6px);
    box-shadow:0 2px 0 #050a07, inset 0 4px 8px rgba(0,0,0,0.5);
    border-color:var(--red);
  }
  .key.pressed .label{ color:var(--red-glow); }

  .output-area{
    background:var(--pcb-dark);
    border-radius:10px;
    padding:12px 14px;
    min-height:56px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);
    margin-bottom:14px;
  }
  .output-area .out-label{ font-size:0.68rem; color:var(--ivory-dim); margin-bottom:5px; letter-spacing:0.05em; }
  #outputText{
    font-family:'Share Tech Mono', monospace;
    font-size:1.05rem;
    color:var(--ivory);
    word-break:break-all;
    line-height:1.5;
    min-height:1.4em;
  }
  #outputText .cursor{ display:inline-block; width:0.5em; background:var(--gold); animation:blink 1s step-end infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  .controls{ display:flex; gap:8px; margin-bottom:8px; }
  .controls button{
    flex:1;
    background:linear-gradient(180deg, #1d3325, #0f1c15);
    border:1px solid var(--gold-dim);
    color:var(--ivory);
    padding:9px 6px;
    border-radius:8px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:0.74rem;
    cursor:pointer;
  }
  .controls button:hover{ background:linear-gradient(180deg,#254030,#132419); }
  .controls button:active{ transform:translateY(1px); }

  .speed-row{ display:flex; align-items:center; gap:10px; margin:14px 2px 2px; font-size:0.75rem; color:var(--ivory-dim); }
  .speed-row input[type=range]{ flex:1; accent-color:var(--gold); }

  footer{ text-align:center; margin-top:18px; font-size:0.68rem; color:var(--ivory-dim); line-height:1.6; }
</style>
</head>
<body>

<div class="board">
  <div class="hole tr"></div>

  <header>
    <h1>MORSE TREE</h1>
    <p>正しい符号を打つと、木の上でその文字の位置が光って進む。<br>ポーズを置くと文字が確定する。</p>
  </header>

  <div class="lamp-row">
    <div class="lamp" id="lampRed"></div>
    <div class="lamp" id="lampGreen"></div>
  </div>

  <div class="treeWrap">
    <svg id="treeSvg" viewBox="0 0 480 335" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="buffer" id="bufferDisplay"><span class="placeholder">信号待機中…</span></div>

  <div class="key-wrap">
    <div class="key" id="key"><div class="label">押して<br>はなす</div></div>
  </div>

  <div class="output-area">
    <div class="out-label">受信文</div>
    <div id="outputText"><span class="cursor">&nbsp;</span></div>
  </div>

  <div class="controls">
    <button id="btnBackspace">1文字削除</button>
    <button id="btnSpace">スペース</button>
    <button id="btnClear">全消去</button>
  </div>

  <div class="speed-row">
    <span>速度</span>
    <input type="range" id="speedSlider" min="60" max="260" value="150" step="10">
    <span id="speedLabel">普通</span>
  </div>

  <div class="controls" style="margin-top:6px;">
    <button id="btnSound">🔊 音: オン</button>
  </div>

  <footer>左側 = ツー（ー）優先の枝　/　右側 = トン（・）優先の枝<br>スペースキーでも打てます（PC）</footer>
</div>

<script>
(function(){
  // ---- Morse letter table (only plain A-Z letters map onto the 4-level tree) ----
  const LETTER_BY_CODE = {
    '.':'E','-':'T',
    '..':'I','.-':'A','-.':'N','--':'M',
    '...':'S','..-':'U','.-.':'R','.--':'W','-..':'D','-.-':'K','--.':'G','---':'O',
    '....':'H','...-':'V','..-.':'F','.-..':'L','.--.':'P','.---':'J',
    '-...':'B','-..-':'X','-.-.':'C','-.--':'Y','--..':'Z','--.-':'Q'
    // remaining depth-4 leaves (..--, .-.-, ---., ----) are intentionally unassigned
  };

  // ---- Build tree layout ----
  const CENTER_X = 240;
  const ROOT_Y = 26;
  const LEVEL_H = 68;
  const BASE_SPREAD = 190; // half-width budget at depth 1

  const nodesByPath = {};
  const edges = [];

  function buildNode(path, x, y, depth){
    nodesByPath[path] = { path, x, y, depth, letter: LETTER_BY_CODE[path] || null };
    if (depth >= 4) return;
    const offset = BASE_SPREAD / Math.pow(2, depth + 1);
    const dotX = x + offset, dashX = x - offset, cy = y + LEVEL_H;
    edges.push({ from: path, to: path + '.', x1:x, y1:y, x2:dotX, y2:cy });
    edges.push({ from: path, to: path + '-', x1:x, y1:y, x2:dashX, y2:cy });
    buildNode(path + '.', dotX, cy, depth + 1);
    buildNode(path + '-', dashX, cy, depth + 1);
  }
  buildNode('', CENTER_X, ROOT_Y, 0);

  // ---- Render SVG ----
  const svg = document.getElementById('treeSvg');
  const svgNS = 'http://www.w3.org/2000/svg';

  edges.forEach(e => {
    const line = document.createElementNS(svgNS, 'path');
    const midY = (e.y1 + e.y2) / 2;
    line.setAttribute('d', `M ${e.x1} ${e.y1} C ${e.x1} ${midY}, ${e.x2} ${midY}, ${e.x2} ${e.y2}`);
    line.setAttribute('class', 'edge');
    line.dataset.to = e.to;
    svg.appendChild(line);
    nodesByPath[e.to].edgeEl = line;
  });

  const rootDot = document.createElementNS(svgNS, 'circle');
  rootDot.setAttribute('cx', CENTER_X); rootDot.setAttribute('cy', ROOT_Y); rootDot.setAttribute('r', 4);
  rootDot.setAttribute('class', 'rootDot');
  svg.appendChild(rootDot);

  Object.values(nodesByPath).forEach(node => {
    if (node.path === '') return;
    const isDash = node.path[node.path.length - 1] === '-';
    let shape;
    if (isDash){
      shape = document.createElementNS(svgNS, 'rect');
      const s = 20;
      shape.setAttribute('x', node.x - s/2);
      shape.setAttribute('y', node.y - s/2);
      shape.setAttribute('width', s);
      shape.setAttribute('height', s);
      shape.setAttribute('rx', 4);
    } else {
      shape = document.createElementNS(svgNS, 'circle');
      shape.setAttribute('cx', node.x);
      shape.setAttribute('cy', node.y);
      shape.setAttribute('r', 11);
    }
    shape.setAttribute('class', 'node-shape' + (node.letter ? '' : ''));
    if (!node.letter) shape.style.opacity = '0.35';
    svg.appendChild(shape);
    node.shapeEl = shape;

    if (node.letter){
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('x', node.x);
      label.setAttribute('y', node.y + 1);
      label.setAttribute('class', 'node-label');
      label.textContent = node.letter;
      svg.appendChild(label);
      node.labelEl = label;
    }
  });

  // small antenna glyph above root
  const antenna = document.createElementNS(svgNS, 'path');
  antenna.setAttribute('d', `M ${CENTER_X-10} ${ROOT_Y-18} L ${CENTER_X} ${ROOT_Y-2} L ${CENTER_X+10} ${ROOT_Y-18} M ${CENTER_X} ${ROOT_Y-2} L ${CENTER_X} ${ROOT_Y}`);
  antenna.setAttribute('stroke', 'var(--gold-dim)');
  antenna.setAttribute('stroke-width', '1.6');
  antenna.setAttribute('fill', 'none');
  svg.insertBefore(antenna, svg.firstChild);

  // ---- Interaction state ----
  const key = document.getElementById('key');
  const bufferDisplay = document.getElementById('bufferDisplay');
  const outputText = document.getElementById('outputText');
  const lampRed = document.getElementById('lampRed');
  const lampGreen = document.getElementById('lampGreen');
  const speedSlider = document.getElementById('speedSlider');
  const speedLabel = document.getElementById('speedLabel');
  const btnSound = document.getElementById('btnSound');

  let unit = 150;
  speedSlider.addEventListener('input', () => {
    unit = parseInt(speedSlider.value, 10);
    speedLabel.textContent = unit <= 100 ? '速い' : (unit >= 200 ? 'ゆっくり' : '普通');
  });

  let soundOn = true;
  btnSound.addEventListener('click', () => {
    soundOn = !soundOn;
    btnSound.textContent = soundOn ? '🔊 音: オン' : '🔇 音: オフ';
  });

  let currentPath = '';
  let pressStart = 0;
  let isPressed = false;
  let letterTimer = null;
  let text = '';

  let audioCtx = null, osc = null, gainNode = null;
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function toneStart(){
    if (!soundOn) return;
    ensureAudio();
    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = 620;
    gainNode.gain.value = 0.0001;
    osc.connect(gainNode).connect(audioCtx.destination);
    osc.start();
    gainNode.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.01);
  }
  function toneStop(){
    if (!osc) return;
    const so = osc, sg = gainNode;
    try {
      sg.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.03);
      so.stop(audioCtx.currentTime + 0.04);
    } catch(e){}
    osc = null; gainNode = null;
  }

  function renderBuffer(){
    bufferDisplay.innerHTML = currentPath.length === 0
      ? '<span class="placeholder">信号待機中…</span>'
      : currentPath.split('').join(' ');
  }
  function renderOutput(){
    outputText.innerHTML = escapeHtml(text) + '<span class="cursor">&nbsp;</span>';
  }
  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function clearTreeClasses(){
    Object.values(nodesByPath).forEach(n => {
      if (n.shapeEl) n.shapeEl.setAttribute('class', 'node-shape');
      if (n.labelEl) n.labelEl.setAttribute('class', 'node-label');
      if (n.edgeEl) n.edgeEl.setAttribute('class', 'edge');
    });
  }

  function highlightPath(finalClass){
    // highlight every prefix node/edge from root to currentPath
    let p = '';
    for (let i = 0; i < currentPath.length; i++){
      p += currentPath[i];
      const n = nodesByPath[p];
      if (!n) break;
      const isLast = (i === currentPath.length - 1);
      const cls = isLast && finalClass ? finalClass : 'visited';
      if (n.shapeEl) n.shapeEl.setAttribute('class', 'node-shape ' + cls);
      if (n.labelEl) n.labelEl.setAttribute('class', 'node-label lit');
      if (n.edgeEl) n.edgeEl.setAttribute('class', 'edge ' + (isLast && finalClass === 'success' ? 'success' : 'active'));
    }
  }

  function flashLamp(el, cls){
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 220);
  }

  function decode(){
    if (currentPath.length === 0) return;
    const node = nodesByPath[currentPath];
    if (node && node.letter){
      highlightPath('success');
      flashLamp(lampGreen, 'on-green');
      text += node.letter;
      renderOutput();
    } else {
      highlightPath('fail');
      flashLamp(lampRed, 'on-red');
    }
    setTimeout(() => {
      clearTreeClasses();
      currentPath = '';
      renderBuffer();
    }, 260);
  }

  function pressDown(){
    if (isPressed) return;
    isPressed = true;
    if (letterTimer){ clearTimeout(letterTimer); letterTimer = null; }
    pressStart = performance.now();
    key.classList.add('pressed');
    toneStart();
  }
  function pressUp(){
    if (!isPressed) return;
    isPressed = false;
    const duration = performance.now() - pressStart;
    key.classList.remove('pressed');
    toneStop();

    const threshold = unit * 2;
    currentPath += (duration < threshold) ? '.' : '-';
    renderBuffer();
    highlightPath(null);

    letterTimer = setTimeout(decode, unit * 2.8);
  }

  key.addEventListener('mousedown', e => { e.preventDefault(); pressDown(); });
  window.addEventListener('mouseup', pressUp);
  key.addEventListener('touchstart', e => { e.preventDefault(); pressDown(); }, {passive:false});
  window.addEventListener('touchend', () => pressUp(), {passive:false});
  key.addEventListener('touchcancel', pressUp);
  key.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat){ e.preventDefault(); pressDown(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space'){ e.preventDefault(); pressUp(); }
  });

  document.getElementById('btnBackspace').addEventListener('click', () => {
    text = text.slice(0, -1);
    renderOutput();
  });
  document.getElementById('btnSpace').addEventListener('click', () => {
    if (letterTimer){ clearTimeout(letterTimer); letterTimer = null; }
    clearTreeClasses();
    currentPath = '';
    renderBuffer();
    if (!text.endsWith(' ')) text += ' ';
    renderOutput();
  });
  document.getElementById('btnClear').addEventListener('click', () => {
    if (letterTimer){ clearTimeout(letterTimer); letterTimer = null; }
    clearTreeClasses();
    currentPath = '';
    text = '';
    renderBuffer();
    renderOutput();
  });

  renderBuffer();
  renderOutput();
})();
</script>

</body>
</html>
